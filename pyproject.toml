[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "1.0.8"
description = "Orbit - 一个基于Windows WASAPI的音频采集工具"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Orbit" }]
keywords = ["wasapi", "loopback", "audio", "recorder", "wav", "flac", "alac"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
  "PySide6>=6.8,<7",
  "PyAudioWPatch>=0.2.12.8",
  "numpy>=1.24,<3",
  "soundfile>=0.12.1",
  "mutagen>=1.47",
]

[project.scripts]
orbit = "orbit.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "sounddevice>=0.4.6"]

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.setuptools.package-data]
orbit = ["assets/*", "assets/icons/*"]